services:
  postgres:
    image: postgres:16
    container_name: gtm-lead-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: lead_automation
      POSTGRES_USER: lead_user
      POSTGRES_PASSWORD: lead_password

    ports:
      - "55432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead_user -d lead_automation"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: